
<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Locwarp｜強開團海報編輯器</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Huninn&family=Zen+Maru+Gothic:wght@400;700;900&family=Noto+Sans+TC:wght@400;700;900&family=Noto+Serif+TC:wght@400;700;900&family=Klee+One:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f6f1}
*{box-sizing:border-box}
body{margin:0;color:#2c4c3a;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"PingFang TC",sans-serif}
header{background:linear-gradient(120deg,#2d5845,#457c60);color:white;padding:18px;font-size:21px;text-align:center;font-weight:800}
header small{display:block;font-size:12px;font-weight:400;opacity:.85;margin-top:5px}
main{max-width:1240px;margin:auto;padding:16px;display:grid;grid-template-columns:minmax(0,380px) minmax(0,1fr);gap:16px;align-items:start}
section{background:white;padding:18px;margin-bottom:15px;border-radius:16px;box-shadow:0 3px 16px #345a4210}
h2{font-size:17px;margin:0 0 12px}
label{display:block;font-size:14px;margin:12px 0 5px;font-weight:650}
input,select,textarea,button{font:inherit}
input[type=text],input[type=date],select,textarea{padding:10px;width:100%;border:1px solid #c7d8cc;border-radius:9px;color:#294837;background:white;min-height:42px}
input[type=range]{display:block;width:100%;accent-color:#397458;margin:5px 0 10px}
input[type=color]{width:68px;height:40px;border:0;padding:0;background:transparent}
textarea{min-height:78px;resize:vertical}
button{border:0;border-radius:9px;background:#376d51;color:white;padding:9px 13px;font-weight:600;cursor:pointer}
button.alt{background:#e7f1e9;color:#2c5840}
button.warn{background:#f9ebe8;color:#994938}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:9px 0}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cols>*{min-width:0}
.hint,.status{font-size:12.5px;color:#697c70;line-height:1.7}
.counter{font-weight:700;padding:10px;background:#eff7ef;border-radius:9px;margin:10px 0}
#gallery{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;max-height:330px;overflow:auto;padding:3px;margin-top:10px}
.thumb{background:#f5f8f5;border:2px solid transparent;padding:5px;border-radius:10px;color:#345646;text-align:center;min-width:0}
.thumb.active{border-color:#397e56;background:#e9f2eb}
.thumb img{display:block;width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:5px}
.thumb span{font-size:12px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-top:4px}
.person{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid #e9f0eb}
.person input{width:19px;height:19px;accent-color:#397458}
.person span{flex:1;font-size:13px;overflow-wrap:anywhere}
.person button{font-size:12px;padding:6px 8px}
#people{max-height:250px;overflow:auto}
#preview{position:sticky;top:12px;text-align:center}
#preview h2{text-align:left}
#canvas{display:block;max-width:520px;width:100%;height:auto;margin:10px auto 13px;touch-action:none;background:#f3efe5;border-radius:5px;box-shadow:0 3px 15px #345a442a}
#download{width:100%;max-width:520px;font-size:16px;padding:14px}
#dateStyleControls{border:1px solid #dae7dd;border-radius:11px;background:#fafcf9;padding:12px;margin-top:12px}
.hidden{display:none!important}
#fontChoices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:10px 0}
.font-choice{background:#f7faf6;border:2px solid #d5e3d9;color:#304e40;padding:8px 5px;display:flex;flex-direction:column;gap:3px;min-height:68px;align-items:center;justify-content:center}
.font-choice.active{border-color:#438465;background:#e6f3ea}
.font-choice .sample{font-size:21px;white-space:nowrap}
.font-choice .name{font-size:12px;font-family:-apple-system,"PingFang TC",sans-serif}
.sample-huninn{font-family:"Huninn","PingFang TC",sans-serif}
.sample-maru{font-family:"Zen Maru Gothic","Huninn",sans-serif;font-weight:900}
.sample-sans{font-family:"Noto Sans TC","PingFang TC",sans-serif;font-weight:700}
.sample-song{font-family:"Noto Serif TC","Songti TC",serif;font-weight:700}
.sample-kai{font-family:"Klee One","Kaiti TC",serif}
@media(max-width:800px){
main{display:flex;flex-direction:column;padding:12px}
main>div,#preview{width:100%}
#preview{position:static;order:-1}
section{padding:14px}
header{font-size:19px}
}
</style>
</head>
<body>
<header>
Locwarp｜強開團海報編輯器
<small>花種底圖・可愛字型・日期放大與弧度調整　Made by 夯</small>
</header>
<main>
<div>
<section>
<h2>共用資源狀態</h2>
<div id="status" class="status">讀取中……</div>
<div class="row">
<button id="reload" class="alt">重新讀取</button>
<button id="restore" class="alt">還原共用資料</button>
</div>
</section>

<section>
<h2>① 搜尋花種底圖</h2>
<input id="search" type="text" placeholder="搜尋花種名稱">
<div id="gallery"></div>
<div id="imageCount" class="hint"></div>
<label>底圖花名（不印上海報）</label>
<input id="flowerName" type="text">
<button id="saveFlower" class="alt">儲存花名</button>
</section>

<section>
<h2>② 勾選花農名單</h2>
<textarea id="newPeople" placeholder="每行一位花農，支援 Emoji、日文及特殊符號"></textarea>
<div class="row">
<button id="addPeople">加入名單</button>
<button id="selectAll" class="alt">全選</button>
<button id="selectNone" class="alt">全不選</button>
</div>
<div id="people"></div>
<div class="counter">本週參與 <span id="participantCount">0</span> 位花農</div>

<label>花農字型（直接點選預覽）</label>
<div id="fontChoices">
<button type="button" class="font-choice" data-font="rounded">
<span class="sample sample-huninn">花農可愛 ♡</span>
<span class="name">台灣粉圓體</span>
</button>
<button type="button" class="font-choice" data-font="playful">
<span class="sample sample-maru">花農可愛 🌸</span>
<span class="name">童趣圓體</span>
</button>
<button type="button" class="font-choice" data-font="sans">
<span class="sample sample-sans">花農名字</span>
<span class="name">清晰黑體</span>
</button>
<button type="button" class="font-choice" data-font="song">
<span class="sample sample-song">花農名字</span>
<span class="name">華麗宋體</span>
</button>
<button type="button" class="font-choice" data-font="kai">
<span class="sample sample-kai">花農名字</span>
<span class="name">典雅手寫體</span>
</button>
</div>
<select id="peopleFont">
<option value="rounded">台灣粉圓體（可愛）</option>
<option value="playful">童趣圓體（可愛）</option>
<option value="sans">清晰黑體</option>
<option value="song">華麗宋體</option>
<option value="kai">典雅手寫體</option>
</select>
<div class="hint" id="fontInfo">字型載入後會自動更新海報。</div>

<div class="row">
<label>花農文字顏色 <input id="peopleColor" type="color" value="#344b40"></label>
<label><input id="peopleOutline" type="checkbox"> 淺色描邊</label>
</div>
<div class="cols">
<div>
<label>文字粗細</label>
<select id="peopleWeight">
<option value="400">一般</option>
<option value="700">粗體</option>
<option value="900">特粗</option>
</select>
</div>
<div>
<label>字體大小 <span id="peopleSizeValue"></span></label>
<input id="peopleSize" type="range" min="12" max="75">
</div>
</div>
<div class="cols">
<div>
<label>左右欄距 <span id="columnGapValue"></span></label>
<input id="columnGap" type="range" min="100" max="340">
</div>
<div>
<label>上下行距 <span id="rowGapValue"></span></label>
<input id="rowGap" type="range" min="16" max="65">
</div>
</div>
<div class="cols">
<div>
<label>名單左右 <span id="groupXValue"></span></label>
<input id="groupX" type="range" min="20" max="80" step=".5">
</div>
<div>
<label>名單上下 <span id="groupYValue"></span></label>
<input id="groupY" type="range" min="65" max="90" step=".5">
</div>
</div>
<button id="resetGroup" class="alt">還原名單排版</button>
<div id="layoutWarning" class="status"></div>
</section>

<section>
<h2>③ 日期</h2>
<label><input id="showDate" type="checkbox" checked> 顯示日期（不遮蓋原本日期框）</label>
<label>活動日期</label>
<input id="date" type="date">
<label>日期格式</label>
<select id="dateFormat">
<option value="short">10/29</option>
<option value="full">2026 / 10 / 29（四）</option>
<option value="dots">2026.10.29</option>
<option value="zh">2026年10月29日</option>
<option value="custom">自訂日期文字</option>
</select>
<div id="customDateWrap" class="hidden">
<label>自訂日期</label>
<input id="customDate" type="text">
</div>
</section>

<section>
<h2>④ 本日總召</h2>
<label><input id="showLeader" type="checkbox"> 顯示總召</label>
<input id="leader" type="text" placeholder="輸入總召姓名">
</section>

<section>
<h2>⑤ 文字位置與樣式</h2>
<label>調整項目</label>
<select id="target">
<option value="date">日期文字</option>
<option value="leader">本日總召</option>
</select>
<div class="cols">
<div>
<label>左右 <strong id="xValue"></strong></label>
<input id="posX" type="range" min="3" max="97" step=".5">
</div>
<div>
<label>上下 <strong id="yValue"></strong></label>
<input id="posY" type="range" min="2" max="98" step=".5">
</div>
</div>
<label>文字大小 <strong id="sizeValue"></strong></label>
<input id="fontSize" type="range" min="14" max="260">

<div id="dateWidthControls">
<label>日期最大寬度 <strong id="dateWidthValue">72%</strong></label>
<input id="dateWidth" type="range" min="35" max="95" value="72">
<div class="hint">日期字級最高 260，可再調整寬度，避免被自動縮小。</div>
</div>

<div id="dateStyleControls">
<label>日期字型</label>
<select id="dateFont">
<option value="rounded">可愛立體圓體</option>
<option value="song">華麗宋體</option>
<option value="kai">典雅手寫體</option>
<option value="serif">歐風襯線</option>
</select>
<label>日期配色</label>
<select id="datePreset">
<option value="purple">紫金華麗</option>
<option value="pink">粉金夢幻</option>
<option value="gold">深金木牌</option>
<option value="green">奶油綠金</option>
<option value="white">奶油白描邊</option>
<option value="custom">自行調色</option>
</select>
<label>日期弧度 <strong id="arcValue"></strong></label>
<input id="dateArc" type="range" min="-35" max="35">
<button id="arcZero" class="alt">恢復直線</button>
<label>字距 <strong id="spacingValue"></strong></label>
<input id="dateSpacing" type="range" min="-3" max="15">
</div>
<div class="row">
<label>文字顏色 <input id="fontColor" type="color"></label>
<label><input id="outline" type="checkbox"> 立體描邊</label>
</div>
<div class="row">
<button id="dateCenter" class="alt">日期置中</button>
<button id="leaderCenter" class="alt">總召回到欄位</button>
</div>
<button id="resetLayout" class="warn">重設文字設定</button>
</section>

<section>
<h2>⑥ 管理員｜共用資料</h2>
<div class="row">
<button id="copyShared">複製共用資料</button>
<button id="downloadShared" class="alt">下載 shared.json</button>
</div>
<div id="adminStatus" class="status"></div>
</section>
</div>

<section id="preview">
<h2>海報即時預覽</h2>
<div class="hint">可以拖曳日期、總召及整組花農位置。</div>
<canvas id="canvas" width="1086" height="1448"></canvas>
<button id="download">下載 PNG 海報</button>
<div id="info" class="status"></div>
</section>
</main>

<script>
'use strict';
const OWNER='han06010912',REPO='locwarp-poster';
const API=`https://api.github.com/repos/${OWNER}/${REPO}/contents/images`;
const $=id=>document.getElementById(id);
const canvas=$('canvas'),ctx=canvas.getContext('2d');
const clone=v=>JSON.parse(JSON.stringify(v));
const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));
const num=(n,d)=>Number.isFinite(+n)&&n!==''&&n!=null?+n:d;
const getLocal=(k,d)=>{
try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}
catch(e){return d}
};

const PALETTES={
purple:{color:'#fff3e5',border:'#e9b7d0',edge:'#59316d'},
pink:{color:'#fff4e8',border:'#ffd5e1',edge:'#ae4b82'},
gold:{color:'#fff4dc',border:'#efd4aa',edge:'#6f471c'},
green:{color:'#fff9e6',border:'#e6d8a9',edge:'#376d55'},
white:{color:'#fff9ee',border:'#e8c99c',edge:'#63447f'},
custom:{color:'#fff4e9',border:'#e9d2bf',edge:'#75448e'}
};

const FONTS={
rounded:'"Huninn","PingFang TC",sans-serif',
playful:'"Zen Maru Gothic","Huninn",sans-serif',
sans:'"Noto Sans TC","PingFang TC",sans-serif',
song:'"Noto Serif TC","Songti TC",serif',
kai:'"Klee One","Kaiti TC",serif'
};
const FONTNAMES={
rounded:'Huninn',playful:'Zen Maru Gothic',
sans:'Noto Sans TC',song:'Noto Serif TC',kai:'Klee One'
};

function empty(){
return{
version:1,flowers:{},people:[],layouts:{},
peopleSize:31,peopleWeight:900,peopleFont:'rounded',
peopleColor:'#344b40',peopleOutline:false,
columnGap:270,rowGap:36,groupX:.5,groupY:.795,
event:{date:'',dateFormat:'short',showDate:true,
customDate:'',leader:'',showLeader:false}
};
}
function normalize(s){
const d=empty();s=s||{};
return{
...d,...s,
flowers:s.flowers||{},layouts:s.layouts||{},
people:Array.isArray(s.people)?s.people:[],
event:{...d.event,...s.event},
peopleFont:FONTS[s.peopleFont]?s.peopleFont:'rounded',
peopleSize:num(s.peopleSize,31),
peopleWeight:num(s.peopleWeight,900),
peopleColor:s.peopleColor||'#344b40',
peopleOutline:!!s.peopleOutline,
columnGap:num(s.columnGap,270),
rowGap:num(s.rowGap,36),
groupX:num(s.groupX,.5),
groupY:num(s.groupY,.795)
};
}

let shared=empty(),data=empty(),files=[];
let selectedFile='',poster=null,drag=null;
let hitAreas=[],selectedTarget='date',imgToken=0;

function draftKey(){return 'locwarp_draft_'+shared.version}
function layout(){return data.layouts[selectedFile]||(data.layouts[selectedFile]={})}
function fixedDefault(k){
return k==='date'
?{x:.5,y:.15,size:82,width:72,arc:0,spacing:0,font:'rounded',preset:'purple',outline:true,color:'#fff3e5'}
:{x:.60,y:.929,size:40,color:'#513d33',outline:true};
}
function fixed(k){
const p={...fixedDefault(k),...(layout()[k]||{})};
if(k==='date'){
p.arc=clamp(num(p.arc,0),-35,35);
p.width=clamp(num(p.width,72),35,95);
p.spacing=num(p.spacing,0);
}
return p;
}
function setFixed(k,changes){
if(!selectedFile)return;
layout()[k]={...fixed(k),...changes};
save();
updateControls();
}

function save(){
data.peopleSize=+$('peopleSize').value;
data.peopleWeight=+$('peopleWeight').value;
data.peopleFont=$('peopleFont').value;
data.peopleColor=$('peopleColor').value;
data.peopleOutline=$('peopleOutline').checked;
data.columnGap=+$('columnGap').value;
data.rowGap=+$('rowGap').value;
data.groupX=+$('groupX').value/100;
data.groupY=+$('groupY').value/100;
data.event={
date:$('date').value,dateFormat:$('dateFormat').value,
showDate:$('showDate').checked,customDate:$('customDate').value,
leader:$('leader').value,showLeader:$('showLeader').checked
};
try{localStorage.setItem(draftKey(),JSON.stringify(data))}
catch(e){}
render();
}

function applyData(s){
data=normalize(s);
$('peopleSize').value=clamp(data.peopleSize,12,75);
$('peopleWeight').value=data.peopleWeight;
$('peopleFont').value=data.peopleFont;
$('peopleColor').value=data.peopleColor;
$('peopleOutline').checked=data.peopleOutline;
$('columnGap').value=clamp(data.columnGap,100,340);
$('rowGap').value=clamp(data.rowGap,16,65);
$('groupX').value=clamp(data.groupX*100,20,80);
$('groupY').value=clamp(data.groupY*100,65,90);
$('date').value=data.event.date||'';
$('dateFormat').value=data.event.dateFormat||'short';
$('customDate').value=data.event.customDate||'';
$('showDate').checked=data.event.showDate!==false;
$('leader').value=data.event.leader||'';
$('showLeader').checked=!!data.event.showLeader;
updateCustom();
updateGroup();
updateFonts();
drawPeople();
drawGallery();
updateControls();
render();
}

async function loadShared(official=false){
try{
const r=await fetch('./shared.json?t='+Date.now());
if(!r.ok)throw Error('無法讀取');
shared=normalize(await r.json());
applyData(official?shared:getLocal(draftKey(),shared));
$('status').textContent='共用資料已載入';
}catch(e){
const s=getLocal(draftKey(),shared);
applyData(s);
$('status').textContent='目前使用本機資料';
}
}
async function loadImages(){
$('imageCount').textContent='正在讀取底圖';
try{
const r=await fetch(API+'?t='+Date.now());
if(!r.ok)throw Error('讀取失敗');
files=(await r.json()).filter(f=>f.type==='file'&&/\.(png|jpe?g|webp)$/i.test(f.name))
.map(f=>({name:f.name,url:f.download_url}));
files.sort((a,b)=>a.name.localeCompare(b.name,'zh-Hant'));
$('imageCount').textContent=`共找到 ${files.length} 張底圖`;
drawGallery();
if(files.length)chooseImage(files[0].name);
}catch(e){$('imageCount').textContent=e.message}
}
function flowerName(f){
return data.flowers[f.name]||f.name.replace(/\.(png|jpe?g|webp)$/i,'');
}
function drawGallery(){
const q=$('search').value.trim().toLowerCase();
const box=$('gallery');box.replaceChildren();
files.forEach(f=>{
const n=flowerName(f);
if(q&&!n.toLowerCase().includes(q))return;
const b=document.createElement('button');
b.className='thumb'+(selectedFile===f.name?' active':'');
const im=document.createElement('img');im.src=f.url;im.loading='lazy';
const t=document.createElement('span');t.textContent=n;
b.append(im,t);b.onclick=()=>chooseImage(f.name);
box.append(b);
});
}
function chooseImage(n){
const f=files.find(x=>x.name===n);if(!f)return;
selectedFile=n;poster=null;const token=++imgToken;
drawGallery();$('flowerName').value=flowerName(f);updateControls();
const im=new Image();im.crossOrigin='anonymous';
im.onload=()=>{
if(token!==imgToken)return;
poster=im;canvas.width=im.naturalWidth;canvas.height=im.naturalHeight;
render();
};
im.onerror=()=>{$('info').textContent='圖片載入失敗'};
im.src=f.url;render();
}

function drawPeople(){
$('people').replaceChildren();
data.people.forEach((p,i)=>{
const row=document.createElement('div');row.className='person';
const ck=document.createElement('input');ck.type='checkbox';ck.checked=p.checked!==false;
ck.onchange=()=>{p.checked=ck.checked;countPeople();save()};
const t=document.createElement('span');t.textContent=p.name;
const edit=document.createElement('button');edit.className='alt';edit.textContent='修改';
edit.onclick=()=>{const n=prompt('修改花農名稱',p.name);if(n?.trim()){p.name=n.trim();drawPeople();save()}};
const del=document.createElement('button');del.className='warn';del.textContent='刪除';
del.onclick=()=>{if(confirm('刪除此花農？')){data.people.splice(i,1);drawPeople();save()}};
row.append(ck,t,edit,del);$('people').append(row);
});
countPeople();
}
function countPeople(){
$('participantCount').textContent=data.people.filter(p=>p.checked!==false).length;
}
function updateGroup(){
['peopleSize','columnGap','rowGap'].forEach(id=>$(id+'Value').textContent=$(id).value);
$('groupXValue').textContent=$('groupX').value+'%';
$('groupYValue').textContent=$('groupY').value+'%';
}
function updateCustom(){
$('customDateWrap').classList.toggle('hidden',$('dateFormat').value!=='custom');
}
function updateControls(){
const p=fixed(selectedTarget);
$('target').value=selectedTarget;
$('posX').value=p.x*100;$('posY').value=p.y*100;
$('fontSize').value=p.size;
$('fontColor').value=p.color;
$('outline').checked=p.outline!==false;
$('xValue').textContent=Math.round(p.x*100)+'%';
$('yValue').textContent=Math.round(p.y*100)+'%';
$('sizeValue').textContent=p.size+'px';
$('dateStyleControls').classList.toggle('hidden',selectedTarget!=='date');
$('dateWidthControls').classList.toggle('hidden',selectedTarget!=='date');
if(selectedTarget==='date'){
$('dateWidth').value=p.width;
$('dateWidthValue').textContent=p.width+'%';
$('dateArc').value=p.arc;$('arcValue').textContent=p.arc;
$('dateSpacing').value=p.spacing;
$('spacingValue').textContent=p.spacing;
$('dateFont').value=p.font;
$('datePreset').value=p.preset;
}
}

function updateFonts(){
document.querySelectorAll('.font-choice').forEach(b=>{
b.classList.toggle('active',b.dataset.font===data.peopleFont);
});
}
async function loadFont(){
const family=FONTNAMES[data.peopleFont]||'Huninn';
$('fontInfo').textContent='正在載入字型……';
try{
await Promise.race([
document.fonts.load(`36px "${family}"`,'花農名字可愛'),
new Promise(r=>setTimeout(r,5000))
]);
}catch(e){}
$('fontInfo').textContent='已選取：'+$('peopleFont').selectedOptions[0].text;
render();
}
function chooseFont(f){
data.peopleFont=f;
$('peopleFont').value=f;
updateFonts();save();loadFont();
}
function dateText(){
const s=data.event,fmt=s.dateFormat,v=s.date;
if(fmt==='custom')return s.customDate||'';
if(!v)return '';
const [y,m,d]=v.split('-').map(Number);
const wd='日一二三四五六'[new Date(y,m-1,d).getDay()];
if(fmt==='short')return `${m}/${d}`;
if(fmt==='dots')return `${y}.${String(m).padStart(2,'0')}.${String(d).padStart(2,'0')}`;
if(fmt==='zh')return `${y}年${m}月${d}日`;
return `${y} / ${String(m).padStart(2,'0')} / ${String(d).padStart(2,'0')}（${wd}）`;
}
function dateFamily(f){
if(f==='song')return FONTS.song;
if(f==='kai')return FONTS.kai;
if(f==='serif')return 'Georgia,serif';
return FONTS.rounded;
}
function drawDate(text){
const p=fixed('date'),w=canvas.width,h=canvas.height,s=w/1086;
const fs=p.size*s,x=p.x*w,y=p.y*h,arc=p.arc*s,space=p.spacing*s;
const letters=Array.from(text);
ctx.save();ctx.font=`900 ${fs}px ${dateFamily(p.font)}`;
ctx.textAlign='center';ctx.textBaseline='middle';ctx.lineJoin='round';
const widths=letters.map(c=>ctx.measureText(c).width);
const total=widths.reduce((a,b)=>a+b,0)+Math.max(0,letters.length-1)*space;
const widthLimit=w*p.width/100;
const factor=Math.min(1,widthLimit/Math.max(total,1));
ctx.translate(x,y);ctx.scale(factor,factor);
let at=-total/2;
const palette=PALETTES[p.preset]||PALETTES.purple;
function paint(c){
if(p.outline){
ctx.lineWidth=9*s;ctx.strokeStyle=palette.edge;ctx.strokeText(c,0,0);
ctx.lineWidth=5*s;ctx.strokeStyle='#d7a973';ctx.strokeText(c,0,0);
ctx.lineWidth=3*s;ctx.strokeStyle=palette.border;ctx.strokeText(c,0,0);
}
ctx.fillStyle=p.color;ctx.fillText(c,0,0);
}
if(arc===0&&space===0){
paint(text);
}else{
for(let i=0;i<letters.length;i++){
const mx=at+widths[i]/2,t=mx/(total/2||1);
const yy=-arc*(1-t*t);
const a=arc===0?0:clamp(Math.atan(2*arc*t/(total/2||1)),-.24,.24);
ctx.save();ctx.translate(mx,yy);ctx.rotate(a);paint(letters[i]);ctx.restore();
at+=widths[i]+space;
}
}
ctx.restore();
hitAreas.push({key:'date',x,y,left:x-total*factor/2-25*s,right:x+total*factor/2+25*s,top:y-fs-Math.abs(arc),bottom:y+fs+Math.abs(arc)});
}
function drawLeader(){
const p=fixed('leader'),w=canvas.width,h=canvas.height,s=w/1086;
ctx.save();ctx.font=`800 ${p.size*s}px ${FONTS.rounded}`;
ctx.fillStyle=p.color;ctx.textAlign='center';ctx.textBaseline='middle';
const x=p.x*w,y=p.y*h,t=data.event.leader;
const tw=Math.min(ctx.measureText(t).width,w*.7);
if(p.outline){ctx.strokeStyle='#fff9e5';ctx.lineWidth=4*s;ctx.strokeText(t,x,y,w*.7)}
ctx.fillText(t,x,y,w*.7);ctx.restore();
hitAreas.push({key:'leader',x,y,left:x-tw/2,right:x+tw/2,top:y-60*s,bottom:y+60*s});
}
function drawPeopleGroup(){
const people=data.people.filter(p=>p.checked!==false);
if(!people.length)return;
const w=canvas.width,h=canvas.height,s=w/1086;
const size=data.peopleSize*s,cols=people.length<=6?1:people.length<=16?2:people.length<=30?3:4;
const heights=Array.from({length:cols},(_,i)=>Math.floor(people.length/cols)+(i<people.length%cols?1:0));
const cx=data.groupX*w,cy=data.groupY*h;
const colgap=data.columnGap*s,rowgap=data.rowGap*s;
ctx.save();ctx.font=`${data.peopleWeight} ${size}px ${FONTS[data.peopleFont]||FONTS.rounded}`;
ctx.textAlign='center';ctx.textBaseline='middle';
ctx.fillStyle=data.peopleColor;
let i=0,left=w,right=0,top=h,bottom=0;
for(let c=0;c<cols;c++){
const x=cx+(c-(cols-1)/2)*colgap;
const y0=cy-(heights[c]-1)*rowgap/2;
for(let r=0;r<heights[c];r++){
const t=people[i++].name,y=y0+r*rowgap,tw=ctx.measureText(t).width;
if(data.peopleOutline){ctx.strokeStyle='#fffaf0';ctx.lineWidth=4*s;ctx.strokeText(t,x,y)}
ctx.fillText(t,x,y);
left=Math.min(left,x-tw/2);right=Math.max(right,x+tw/2);
top=Math.min(top,y-size);bottom=Math.max(bottom,y+size);
}
}
ctx.restore();
hitAreas.push({key:'group',x:cx,y:cy,left,right,top,bottom});
$('layoutWarning').textContent=(left<0||right>w||bottom>h)?'提醒：名單超出畫面，請調整字級與欄距。':'';
}
function render(){
ctx.clearRect(0,0,canvas.width,canvas.height);
if(poster)ctx.drawImage(poster,0,0,canvas.width,canvas.height);
else{
ctx.fillStyle='#f2efe8';ctx.fillRect(0,0,canvas.width,canvas.height);
ctx.fillStyle='#697a70';ctx.font='30px sans-serif';
ctx.textAlign='center';ctx.fillText('請選擇底圖',canvas.width/2,canvas.height/2);
}
hitAreas=[];
if(data.event.showDate&&dateText())drawDate(dateText());
if(data.event.showLeader&&data.event.leader.trim())drawLeader();
drawPeopleGroup();
}
function point(e){
const b=canvas.getBoundingClientRect();
return{x:(e.clientX-b.left)*canvas.width/b.width,y:(e.clientY-b.top)*canvas.height/b.height};
}
canvas.onpointerdown=e=>{
const q=point(e);
const hit=[...hitAreas].reverse().find(a=>q.x>=a.left&&q.x<=a.right&&q.y>=a.top&&q.y<=a.bottom);
if(!hit)return;
drag={key:hit.key,dx:q.x-hit.x,dy:q.y-hit.y};
if(hit.key!=='group'){selectedTarget=hit.key;updateControls()}
canvas.setPointerCapture(e.pointerId);e.preventDefault();
};
canvas.onpointermove=e=>{
if(!drag)return;
const q=point(e),x=(q.x-drag.dx)/canvas.width,y=(q.y-drag.dy)/canvas.height;
if(drag.key==='group'){
data.groupX=clamp(x,.2,.8);data.groupY=clamp(y,.65,.9);
$('groupX').value=data.groupX*100;$('groupY').value=data.groupY*100;
updateGroup();save();
}else setFixed(drag.key,{x:clamp(x,.03,.97),y:clamp(y,.02,.98)});
};
canvas.onpointerup=canvas.onpointercancel=()=>drag=null;

function downloadPoster(){
if(!poster){alert('請先選擇花種底圖');return}
render();
canvas.toBlob(blob=>{
if(!blob)return;
const url=URL.createObjectURL(blob),a=document.createElement('a');
a.href=url;a.download=flowerName({name:selectedFile})+'-海報.png';
document.body.append(a);a.click();a.remove();
setTimeout(()=>URL.revokeObjectURL(url),60000);
},'image/png');
}
function sharedExport(){
const d=clone(data);
d.version=num(shared.version,1)+1;
d.updated=new Date().toLocaleDateString('en-CA');
return JSON.stringify(d,null,2);
}
function downloadShared(){
const b=new Blob([sharedExport()],{type:'application/json'});
const url=URL.createObjectURL(b),a=document.createElement('a');
a.href=url;a.download='shared.json';
document.body.append(a);a.click();a.remove();
setTimeout(()=>URL.revokeObjectURL(url),60000);
}
async function copyShared(){
try{
await navigator.clipboard.writeText(sharedExport());
$('adminStatus').textContent='已複製，可貼到 GitHub 的 shared.json';
}catch(e){downloadShared()}
}
$('reload').onclick=()=>loadShared();
$('restore').onclick=()=>{
if(confirm('還原共用資料？')){
localStorage.removeItem(draftKey());loadShared(true);
}
};
$('search').oninput=drawGallery;
$('saveFlower').onclick=()=>{
if(!selectedFile)return;
data.flowers[selectedFile]=$('flowerName').value.trim();
drawGallery();save();
};
$('addPeople').onclick=()=>{
$('newPeople').value.split(/\r?\n/).map(x=>x.trim()).filter(Boolean).forEach(n=>{
if(!data.people.some(p=>p.name===n))
data.people.push({id:Date.now()+Math.random(),name:n,checked:true});
});
$('newPeople').value='';drawPeople();save();
};
$('selectAll').onclick=()=>{data.people.forEach(p=>p.checked=true);drawPeople();save()};
$('selectNone').onclick=()=>{data.people.forEach(p=>p.checked=false);drawPeople();save()};
['peopleSize','peopleWeight','peopleColor','peopleOutline','columnGap','rowGap','groupX','groupY'].forEach(id=>{
$(id).oninput=()=>{updateGroup();save()};
});
$('peopleFont').onchange=()=>chooseFont($('peopleFont').value);
document.querySelectorAll('.font-choice').forEach(b=>{
b.onclick=()=>chooseFont(b.dataset.font);
});
$('resetGroup').onclick=()=>{
data.groupX=.5;data.groupY=.795;
$('peopleSize').value=31;$('columnGap').value=270;$('rowGap').value=36;
$('groupX').value=50;$('groupY').value=79.5;
updateGroup();save();
};
$('target').onchange=()=>{selectedTarget=$('target').value;updateControls()};
[['posX','x'],['posY','y'],['fontSize','size']].forEach(([id,k])=>{
$(id).oninput=()=>setFixed(selectedTarget,{[k]:k==='size'?+$(id).value:+$(id).value/100});
});
$('dateWidth').oninput=()=>setFixed('date',{width:+$('dateWidth').value});
$('dateArc').oninput=()=>setFixed('date',{arc:+$('dateArc').value});
$('arcZero').onclick=()=>setFixed('date',{arc:0});
$('dateSpacing').oninput=()=>setFixed('date',{spacing:+$('dateSpacing').value});
$('dateFont').onchange=()=>setFixed('date',{font:$('dateFont').value});
$('datePreset').onchange=()=>{
const preset=$('datePreset').value;
setFixed('date',{preset,color:PALETTES[preset].color});
};
$('fontColor').oninput=()=>setFixed(selectedTarget,{color:$('fontColor').value,preset:'custom'});
$('outline').onchange=()=>setFixed(selectedTarget,{outline:$('outline').checked});
$('dateCenter').onclick=()=>setFixed('date',{x:.5,y:.15});
$('leaderCenter').onclick=()=>setFixed('leader',{x:.60,y:.929});
$('resetLayout').onclick=()=>{
if(!confirm('重設這張底圖的文字設定？'))return;
delete layout().date;delete layout().leader;
updateControls();save();
};
['date','dateFormat','showDate','customDate','showLeader','leader'].forEach(id=>{
$(id).oninput=()=>{updateCustom();save()};
$(id).onchange=()=>{updateCustom();save()};
});
$('download').onclick=downloadPoster;
$('copyShared').onclick=copyShared;
$('downloadShared').onclick=downloadShared;
(async()=>{
await loadShared();
await loadImages();
loadFont();
})();
</script>
</body>
