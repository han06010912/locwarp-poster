
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Locwarp 海報製作</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f5f3ed;color:#304b42;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif}
header{background:#436b59;color:white;text-align:center;padding:18px;font-size:23px;font-weight:bold}
main{max-width:1150px;margin:auto;padding:14px;display:grid;grid-template-columns:380px 1fr;gap:16px}
section{background:white;padding:16px;border-radius:16px;margin-bottom:14px;box-shadow:0 2px 10px #0000000a}
h3{margin:0 0 12px;font-size:17px}
input,textarea,button{font:inherit}
input[type=text],input[type=date],textarea{width:100%;padding:11px;border:1px solid #c9d6cd;border-radius:9px;margin:6px 0}
textarea{height:95px;resize:vertical}
button{border:0;border-radius:9px;padding:10px 14px;background:#436b59;color:white;cursor:pointer}
button.secondary{background:#e4eee7;color:#304b42}
button:disabled{opacity:.5}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row>*{flex-shrink:0}
label{display:block;margin:9px 0}
label input[type=checkbox]{accent-color:#436b59;width:18px;height:18px;vertical-align:middle}
#gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;max-height:365px;overflow:auto;margin-top:12px}
.thumb{background:#f6f6f2;border:2px solid transparent;border-radius:10px;padding:5px;min-width:0}
.thumb.active{border-color:#4c8a69}
.thumb img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:6px}
.thumb span{display:block;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#people{max-height:230px;overflow:auto}
.person{display:flex;align-items:center;gap:8px;padding:6px;border-bottom:1px solid #eee}
.person input{accent-color:#436b59;width:18px;height:18px}
.person span{flex:1;overflow-wrap:anywhere}
.person button{padding:5px 9px;background:#eee;color:#555}
#preview{position:sticky;top:12px;align-self:start;text-align:center}
canvas{display:block;width:100%;height:auto;max-width:480px;margin:12px auto;border-radius:6px;box-shadow:0 3px 18px #0002;background:#f0eee8}
small{color:#718077}
#status{font-size:13px;color:#69796e;margin:8px 0}
@media(max-width:760px){main{display:block}#preview{position:static}header{font-size:21px}}
</style>
</head>
<body>
<header>🌸 Locwarp 海報製作</header>
<main>
<div>
<section>
<h3>① 選擇花種底圖</h3>
<input type="text" id="search" placeholder="搜尋花種名稱">
<div class="row">
<button onclick="loadImages()">重新讀取圖片</button>
<span id="imageCount">讀取中</span>
</div>
<div id="gallery"></div>
<div id="status"></div>
<div id="renameBox" hidden>
<label>選取圖片的花種名稱</label>
<input id="flowerName" type="text" placeholder="例如：櫻花">
<button class="secondary" onclick="saveFlowerName()">儲存名稱</button>
</div>
</section>

<section>
<h3>② 花農名單</h3>
<small>每行輸入一位花農，可儲存並重複勾選。</small>
<textarea id="newPeople" placeholder="夯夯&#10;大文&#10;飄飄"></textarea>
<div class="row">
<button onclick="addPeople()">加入名單</button>
<button class="secondary" onclick="toggleAll(true)">全選</button>
<button class="secondary" onclick="toggleAll(false)">全不選</button>
</div>
<div id="people"></div>
</section>

<section>
<h3>③ 日期與總召</h3>
<label><input type="checkbox" id="showDate" checked> 顯示日期</label>
<input type="date" id="date">
<label><input type="checkbox" id="showLeader"> 顯示本日總召姓名</label>
<input type="text" id="leader" placeholder="輸入總召姓名">
</section>

<section>
<h3>④ 字體設定</h3>
<label>花農名字大小</label>
<input type="range" id="nameSize" min="20" max="52" value="33" style="width:100%">
<label>字體顏色</label>
<input type="color" id="color" value="#344c43">
<label>名單上下位置</label>
<input type="range" id="position" min="65" max="83" value="72" style="width:100%">
<button onclick="downloadPoster()" style="width:100%;margin-top:15px">下載 PNG 海報</button>
</section>
</div>

<section id="preview">
<h3>海報即時預覽</h3>
<small>選擇圖片、花農及日期後自動更新</small>
<canvas id="canvas" width="1086" height="1448"></canvas>
</section>
</main>

<script>
const owner="han06010912";
const repo="locwarp-poster";
const api=`https://api.github.com/repos/${owner}/${repo}/contents/images`;
const $=id=>document.getElementById(id);
const canvas=$("canvas");
const ctx=canvas.getContext("2d");

let files=[];
let selected=null;
let image=null;
let people=JSON.parse(localStorage.getItem("lw_people")||"[]");
let names=JSON.parse(localStorage.getItem("lw_names")||"{}");

function save(){
 localStorage.setItem("lw_people",JSON.stringify(people));
 localStorage.setItem("lw_names",JSON.stringify(names));
}

async function loadImages(){
 $("status").textContent="正在讀取 GitHub 圖片...";
 try{
  const r=await fetch(api+"?t="+Date.now(),{
   headers:{"Accept":"application/vnd.github+json"}
  });
  if(!r.ok)throw Error("GitHub 回應 "+r.status);
  const data=await r.json();
  files=data.filter(f=>/\.(png|jpg|jpeg|webp)$/i.test(f.name))
   .map(f=>({name:f.name,url:f.download_url}));
  $("imageCount").textContent=files.length+" 張";
  $("status").textContent="圖片讀取完成";
  showGallery();
  if(files.length&&!selected)chooseImage(files[0].name);
  if(!files.length)$("status").textContent="images 資料夾尚無可用圖片";
 }catch(e){
  $("status").textContent="讀取失敗："+e.message;
 }
}

function showGallery(){
 const keyword=$("search").value.trim().toLowerCase();
 const box=$("gallery");
 box.innerHTML="";
 files.filter(f=>(names[f.name]||f.name).toLowerCase().includes(keyword))
 .forEach(f=>{
  const b=document.createElement("button");
  b.className="thumb"+(selected===f.name?" active":"");
  const img=document.createElement("img");
  img.src=f.url;img.loading="lazy";
  const label=document.createElement("span");
  label.textContent=names[f.name]||f.name.replace(/\.[^.]+$/,"");
  b.append(img,label);
  b.onclick=()=>chooseImage(f.name);
  box.appendChild(b);
 });
}

function chooseImage(filename){
 const f=files.find(x=>x.name===filename);
 if(!f)return;
 selected=filename;
 $("renameBox").hidden=false;
 $("flowerName").value=names[filename]||"";
 showGallery();
 const im=new Image();
 im.crossOrigin="anonymous";
 im.onload=()=>{
  image=im;
  canvas.width=im.naturalWidth;
  canvas.height=im.naturalHeight;
  draw();
 };
 im.onerror=()=>{$("status").textContent="無法載入這張圖片";};
 im.src=f.url;
}

function saveFlowerName(){
 if(!selected)return;
 const n=$("flowerName").value.trim();
 if(n)names[selected]=n;
 else delete names[selected];
 save();
 showGallery();
}

function addPeople(){
 const arr=$("newPeople").value.split(/\n|,|，/)
 .map(s=>s.trim()).filter(Boolean);
 arr.forEach(n=>{
  if(!people.some(p=>p.name===n))
   people.push({name:n,checked:true});
 });
 $("newPeople").value="";
 save();renderPeople();draw();
}

function toggleAll(value){
 people.forEach(p=>p.checked=value);
 save();renderPeople();draw();
}

function renderPeople(){
 const box=$("people");box.innerHTML="";
 people.forEach((p,i)=>{
  const div=document.createElement("div");
  div.className="person";
  const check=document.createElement("input");
  check.type="checkbox";check.checked=p.checked;
  check.onchange=()=>{
   p.checked=check.checked;save();draw();
  };
  const span=document.createElement("span");
  span.textContent=p.name;
  const del=document.createElement("button");
  del.textContent="刪除";
  del.onclick=()=>{
   people.splice(i,1);save();renderPeople();draw();
  };
  div.append(check,span,del);
  box.appendChild(div);
 });
}

function draw(){
 const w=canvas.width,h=canvas.height;
 ctx.clearRect(0,0,w,h);
 if(!image){
  ctx.fillStyle="#f5f1e9";
  ctx.fillRect(0,0,w,h);
  ctx.fillStyle="#667";
  ctx.font="28px sans-serif";
  ctx.textAlign="center";
  ctx.fillText("請先選擇海報底圖",w/2,h/2);
  return;
 }
 ctx.drawImage(image,0,0,w,h);
 const scale=w/1086;
 const color=$("color").value;
 ctx.fillStyle=color;
 ctx.textAlign="center";
 ctx.textBaseline="middle";

 if($("showDate").checked&&$("date").value){
  const d=new Date($("date").value+"T12:00:00");
  const dateText=`${d.getFullYear()} / ${d.getMonth()+1} / ${d.getDate()}`;
  ctx.font=`bold ${25*scale}px sans-serif`;
  ctx.fillText(dateText,w*.50,h*.091,w*.43);
 }

 const arr=people.filter(p=>p.checked).map(p=>p.name);
 const rows=Math.ceil(arr.length/2);
 const baseSize=Number($("nameSize").value)*scale;
 const maxAreaHeight=h*.20;
 const lineHeight=Math.min(baseSize*1.8,maxAreaHeight/Math.max(rows,1));
 const fontSize=Math.min(baseSize,lineHeight*.75);
 const start=h*Number($("position").value)/100;
 ctx.font=`bold ${fontSize}px sans-serif`;
 arr.forEach((n,i)=>{
  const col=i%2;
  const row=Math.floor(i/2);
  const x=w*(col===0?.32:.68);
  const y=start+row*lineHeight;
  ctx.fillText(n,x,y,w*.30);
 });

 if($("showLeader").checked&&$("leader").value.trim()){
  ctx.font=`bold ${29*scale}px sans-serif`;
  ctx.fillText($("leader").value.trim(),w*.64,h*.915,w*.45);
 }
}

function downloadPoster(){
 if(!image){alert("請先選擇底圖");return;}
 draw();
 try{
  canvas.toBlob(blob=>{
   if(!blob){alert("無法產生圖片");return;}
   const a=document.createElement("a");
   const url=URL.createObjectURL(blob);
   a.href=url;
   a.download=(names[selected]||"Locwarp")+"-海報.png";
   document.body.appendChild(a);
   a.click();a.remove();
   setTimeout(()=>URL.revokeObjectURL(url),30000);
  },"image/png");
 }catch(e){alert("圖片輸出失敗："+e.message);}
}

["showDate","date","showLeader","leader","nameSize","color","position"]
.forEach(id=>{
 $(id).addEventListener("input",draw);
 $(id).addEventListener("change",draw);
});
$("search").addEventListener("input",showGallery);

$("date").value=new Date().toLocaleDateString("en-CA");
renderPeople();
loadImages();
draw();
</script>
</body>
</html>
